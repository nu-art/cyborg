applyAndroidApplication("com.nu.art.cyborg.unity", "cyborg-unity-poc")

android {
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	defaultConfig {
		minSdk 25
		ndk {
			abiFilters 'arm64-v8a'
		}
	}
	packaging {
		jniLibs {
			pickFirsts += ['**/libc++_shared.so']
		}
	}
}

configurations.all {
	exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
	exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
	implementation(resolveDependency('cyborg-x', 'com.nu-art-software.cyborg', "${NU_ART_VERSION}"))
	implementation 'androidx.concurrent:concurrent-futures:1.1.0'
	implementation('com.google.guava:listenablefuture:1.0') {
		version { strictly '1.0' }
	}
	if (findProject(':unityLibrary') != null) {
		implementation project(':unityLibrary')
		implementation files("${project(':unityLibrary').projectDir}/libs/unity-classes.jar")
	}
}
